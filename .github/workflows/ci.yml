name: BitePass Production Readiness CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Lint, OpenAPI, Coverage & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STORAGE_DRIVER: memory
      APP_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies cleanly
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Verify TypeScript strictness
        run: npm run typecheck

      - name: Verify ESLint (--max-warnings=0)
        run: npm run lint

      - name: Verify Markdown links & .env.example parity
        run: npm run check:links

      - name: Regenerate & verify OpenAPI 3.1 contract parity
        run: |
          npm run openapi:generate
          npm run check:docs
          git diff --exit-code openapi/openapi.v1.json

      - name: Run Vitest unit & integration coverage suite
        run: npm run test:coverage

      - name: Build Next.js production bundle
        run: npm run build

  e2e:
    name: Playwright Deterministic E2E & Multi-Viewport Audit
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    env:
      STORAGE_DRIVER: memory
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E regression & responsive overflow audit
        run: npm run test:e2e

